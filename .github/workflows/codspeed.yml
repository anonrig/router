name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request:
  # Lets CodSpeed backfill historical data from the dashboard.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: codspeed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        with:
          mode: simulation
          run: >-
            pnpm exec vitest bench --run
            benches/hotpath.bench.ts
            benches/history.bench.ts
            benches/navigation.bench.ts
            benches/ssr-rps.bench.ts
            benches/tanstack/search-params.bench.ts
            benches/tanstack/ssr-match-id.bench.ts &&
            pnpm exec vitest bench --run benches/tanstack/link.bench.tsx &&
            pnpm exec vitest bench --run benches/tanstack/closing-tag-detection.bench.ts
