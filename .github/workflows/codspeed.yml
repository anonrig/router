name: CodSpeed

on:
  push:
    branches:
      - main
  pull_request:
  # Lets CodSpeed backfill historical data from the dashboard.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: codspeed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmarks:
    name: Run ${{ matrix.name }}
    # Pinned image: `ubuntu-latest` lets BASE and HEAD land on different image
    # builds, which CodSpeed flags as "different runtime environments" and can
    # produce false-positive regressions.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: core
            files: >-
              benches/hotpath.bench.ts
              benches/history.bench.ts
              benches/navigation.bench.ts
              benches/ssr-rps.bench.ts
              benches/tanstack/search-params.bench.ts
              benches/tanstack/ssr-match-id.bench.ts
          - name: link
            files: benches/tanstack/link.bench.tsx
          - name: closing-tag
            files: benches/tanstack/closing-tag-detection.bench.ts
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        with:
          mode: simulation
          # Allocator cost varies with the host CPU/image (glibc feature
          # detection), which dominates allocation-heavy React render benches.
          # Excluding allocator frames keeps comparisons about our code.
          exclude-allocations: true
          run: pnpm exec vitest bench --run ${{ matrix.files }}
