name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: How to move the lockstep package version
        type: choice
        options:
          - none
          - patch
          - minor
          - major
          - prerelease
        default: none
      version:
        description: Exact version (optional, overrides bump)
        type: string
        required: false
      dry_run:
        description: Run checks and print the publish plan without publishing
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          # Do not set registry-url. setup-node would write
          # `_authToken=${NODE_AUTH_TOKEN}` into .npmrc, and an empty token
          # disables npm's OIDC trusted-publishing exchange.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm knip
      - run: pnpm test
      - run: pnpm test:types
      - run: pnpm build
      - name: TanStack core runtime
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm test:tanstack-core:ci
      - name: TanStack history runtime
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm test:tanstack-history
      - name: TanStack React runtime
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm test:tanstack-react:ci

      - name: Bump versions
        if: github.event_name == 'workflow_dispatch'
        id: bump
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          extra=()
          if [ -n "$RELEASE_VERSION" ]; then
            extra+=(--version "$RELEASE_VERSION")
          fi
          VERSION=$(node scripts/bump-release.mjs --bump "$RELEASE_BUMP" "${extra[@]}")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION"

      - name: Resolve tag version
        if: github.event_name == 'push'
        id: tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/bump-release.mjs --check "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json packages/*/package.json
          if git diff --cached --quiet; then
            echo "Version files already at $VERSION"
          else
            git commit -m "Release $TAG"
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            existing=$(git rev-parse "$TAG^{commit}")
            head=$(git rev-parse HEAD)
            if [ "$existing" != "$head" ]; then
              echo "::error::Tag $TAG points at $existing, not HEAD $head"
              exit 1
            fi
            echo "Tag $TAG already points at HEAD"
          else
            git tag -a "$TAG" -m "Release $TAG"
          fi
          git push origin HEAD
          git push origin "$TAG"

      - name: Publish packages
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
            echo "registry=https://registry.npmjs.org/" >> "$HOME/.npmrc"
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            unset NODE_AUTH_TOKEN NPM_TOKEN
          fi
          pnpm release

      - name: Dry-run publish
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
            echo "registry=https://registry.npmjs.org/" >> "$HOME/.npmrc"
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            unset NODE_AUTH_TOKEN NPM_TOKEN
          fi
          pnpm release --dry-run

      - name: Create GitHub Release
        if: github.event_name == 'push' || !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag || steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
